name: Deploy to Azure

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: azure-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Winston.UI/package-lock.json

      - name: Create Angular environment
        env:
          ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
          ENTRA_API_CLIENT_ID: ${{ vars.ENTRA_API_CLIENT_ID }}
        run: |
          : "${ENTRA_CLIENT_ID:?Set ENTRA_CLIENT_ID on the production environment}"
          : "${ENTRA_API_CLIENT_ID:?Set ENTRA_API_CLIENT_ID on the production environment}"
          cp Winston.UI/src/environments/environment.example.ts Winston.UI/src/environments/environment.ts
          sed -i "s/ENTRA_CLIENT_ID/${ENTRA_CLIENT_ID}/g" Winston.UI/src/environments/environment.ts
          sed -i "s/ENTRA_API_CLIENT_ID/${ENTRA_API_CLIENT_ID}/g" Winston.UI/src/environments/environment.ts

      - name: Build Angular UI
        working-directory: Winston.UI
        run: |
          npm ci
          npm run build -- --configuration production

      - name: Copy Angular build into API
        run: |
          mkdir -p Winston.API/wwwroot
          cp -R Winston.UI/dist/winston/browser/. Winston.API/wwwroot/

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Publish API
        run: |
          dotnet restore Winston.slnx
          dotnet publish Winston.API/Winston.API.csproj --configuration Release --output publish --no-restore

      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Azure Web App
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish
