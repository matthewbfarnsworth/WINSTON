name: Build and Deploy to Azure

on:
  push:
    branches:
    - azure-migration
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create Environment from Template
        run: |
          cp Winston.UI/src/environments/environment.example.ts Winston.UI/src/environments/environment.ts
          sed -i 's/ENTRA_CLIENT_ID/${{ secrets.ENTRA_CLIENT_ID }}/g' Winston.UI/src/environments/environment.ts
          sed -i 's/ENTRA_API_CLIENT_ID/${{ secrets.ENTRA_API_CLIENT_ID }}/g' Winston.UI/src/environments/environment.ts

      - name: Build Angular UI
        run: |
          cd Winston.UI
          npm ci
          npm run build -- --configuration production

      - name: Copy Angular Build to API wwwroot
        run: |
          mkdir -p Winston.API/wwwroot
          cp -r Winston.UI/dist/winston/browser/* Winston.API/wwwroot/

      - name: Set Up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore Dependencies
        run: dotnet restore Winston.slnx

      - name: Build API
        run: dotnet build ./Winston.API/Winston.API.csproj --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish ./Winston.API/Winston.API.csproj --configuration Release --output ./publish --no-build

      - name: Sign In to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ./publish
