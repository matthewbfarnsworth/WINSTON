version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /Winston.UI
    schedule:
      interval: weekly
    ignore:
      # Angular 22 currently requires TypeScript >=6.0 and <6.1. Keep accepting
      # compatible patch releases without grouping an unsupported 6.1/7.x bump.
      - dependency-name: typescript
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      dotnet-dependencies:
        patterns:
          - "*"

  - package-ecosystem: terraform
    directory: /Winston.Infra
    schedule:
      interval: weekly
    groups:
      terraform-providers:
        patterns:
          - "*"
