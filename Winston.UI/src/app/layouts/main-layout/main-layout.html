<div class="min-h-screen bg-slate-50 text-slate-800 flex flex-col font-sans pb-20">
    <header class="bg-white border-b border-slate-200 px-4 h-14 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <span class="font-bold text-slate-900">Winston</span>
        </div>
        <a routerLink="/settings" title="Settings" class="shrink-0 hover:opacity-80 transition-all duration-150 ease-in-out focus:outline-none focus:ring-2 focus:ring-cyan-500/20 rounded-full">
            <app-avatar [name]="currentUser()?.name" [avatarUrl]="currentUser()?.avatarUrl" size="large" />
        </a>
    </header>

    <main class="grow w-full max-w-md mx-auto p-4">
        <router-outlet></router-outlet>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 h-16 z-50">
        <div class="max-w-md mx-auto h-full flex items-center justify-around">
            <a routerLink="/home" routerLinkActive="text-cyan-600 font-semibold" [routerLinkActiveOptions]="{ exact: true }"
                class="text-sm text-slate-500 hover:text-cyan-600 transition-all duration-150 ease-in-out">
              Home
            </a>
            <a routerLink="/trips" routerLinkActive="text-cyan-600 font-semibold"
                class="text-sm text-slate-500 hover:text-cyan-600 transition-all duration-150 ease-in-out">
              Trips
            </a>
            <a routerLink="/transactions" routerLinkActive="text-cyan-600 font-semibold"
                class="text-sm text-slate-500 hover:text-cyan-600 transition-all duration-150 ease-in-out">
              Transactions
            </a>
            <a routerLink="/settings" routerLinkActive="text-cyan-600 font-semibold"
                class="text-sm text-slate-500 hover:text-cyan-600 transition-all duration-150 ease-in-out">
              Settings
            </a>
        </div>
    </nav>
</div>
