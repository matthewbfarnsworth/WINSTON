@if (avatarUrl() && !hasImageError()) {
    <img [src]="avatarUrl()" (error)="hasImageError.set(true)" class="w-7 h-7 rounded-full object-cover border border-slate-200 shrink-0" />
} @else {
    <span class="w-7 h-7 rounded-full bg-cyan-700 text-white text-xs font-bold flex items-center justify-center shrink-0">
        {{ initials() }}
    </span>
}
