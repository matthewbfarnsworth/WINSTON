<select
  [value]="value()"
  (change)="onChange($event)"
  [disabled]="disabled()"
  [class]="compact() ? 'grow text-xs p-1 border border-slate-300 rounded bg-white disabled:bg-slate-100 focus:outline-none focus:border-cyan-600 focus:ring-2 focus:ring-cyan-500/20 transition-all duration-150 ease-in-out' : 'w-full px-3 py-1.5 text-sm border border-slate-300 rounded bg-white focus:outline-none focus:border-cyan-600 focus:ring-2 focus:ring-cyan-500/20 transition-all duration-150 ease-in-out'">
  @for (user of users(); track (user.id || $index)) {
    <option [value]="user.id">{{ user.name }}</option>
  }
</select>
