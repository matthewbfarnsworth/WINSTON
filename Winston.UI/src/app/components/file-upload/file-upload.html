<input type="file"
  (change)="onFileSelected($event)"
  class="text-xs text-slate-500 file:mr-2 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-cyan-50 file:text-cyan-700 hover:file:bg-cyan-100" />
@if (isUploading()) {
  <div class="text-xs text-cyan-600 mt-1">Uploading receipt...</div>
}
@if (imageUrl()) {
  <div class="mt-2">
    <img [src]="imageUrl()"
      alt="Receipt preview"
      class="max-h-36 rounded border border-slate-200 mt-1" />
  </div>
}
