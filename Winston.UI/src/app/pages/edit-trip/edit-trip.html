<div class="max-w-md mx-auto space-y-4">
    @if (isLoading()) {
        <div class="flex items-center justify-between gap-4">
            <app-loading-state />
            <app-link-button routerLink="/trips" variant="muted">Back</app-link-button>
        </div>
    } @else {
        <div class="flex items-center justify-between gap-4">
            <h1 class="grow">
                <input type="text"
                    [ngModel]="name()"
                    (ngModelChange)="name.set($event)"
                    placeholder="New Trip"
                    class="text-xl font-bold text-slate-900 tracking-tight border-b border-transparent hover:border-slate-300 focus:border-cyan-600 focus:outline-none w-full py-0.5" />
            </h1>
            <app-link-button routerLink="/trips" variant="muted">Back</app-link-button>
        </div>


        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Date:</label>
                <app-date-input [(value)]="date" />
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Total:</label>
                <app-currency-input [(value)]="total" />
            </div>
            <div class="border-t border-b border-slate-200 py-3 space-y-2">
                <div class="flex items-center justify-between">
                    <label class="text-xs font-semibold text-slate-700">Users:</label>
                    <app-small-button (buttonClick)="addUser()" [disabled]="!canAddMoreUsers()">
                        + Add User
                    </app-small-button>
                </div>
                <div class="space-y-2">
                    @for (tripUser of tripUsers(); track tripUser.userId) {
                        <div class="flex items-center space-x-2 bg-slate-50 p-2 rounded border border-slate-200">
                            <app-user-select
                                [users]="getAvailableUsersForDropdown(tripUser.userId)"
                                [value]="tripUser.userId"
                                (valueChange)="updateUserId($index, $event)"
                                [disabled]="isOwner(tripUser.userId)"
                                [compact]="true"
                                class="grow min-w-0" />
                            <div class="flex items-center space-x-1 shrink-0">
                                <label class="text-xs text-slate-600 font-medium whitespace-nowrap">Personal:</label>
                                <app-currency-input
                                    [value]="tripUser.personalCost || 0"
                                    (valueChange)="updatePersonalCost($index, $event)"
                                    [compact]="true" />
                            </div>
                            <div class="w-5 flex justify-center shrink-0">
                                @if (!isOwner(tripUser.userId)) {
                                    <app-danger-button (buttonClick)="removeUser($index)">x</app-danger-button>
                                }
                            </div>
                        </div>
                    }
                </div>

            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Upload receipt:</label>
                <app-file-upload
                    [(imageUrl)]="receiptImageUrl"
                    [isUploading]="isUploading()"
                    (fileSelected)="onFileSelected($event)" />
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Notes:</label>
                <app-notes-input [(value)]="notes" />
            </div>
            <div class="bg-slate-50 p-3 rounded border border-slate-200 space-y-1">
                <label class="block text-xs font-semibold text-slate-700">Summary:</label>
                @for (item of getSummarySplits(); track item.userName) {
                    <p class="text-xs text-slate-700">
                        {{ item.userName }} owes you {{ item.owesAmount | currency }}
                    </p>
                }
            </div>
            <div>
                <app-primary-button (buttonClick)="saveTrip()" [disabled]="!isFormValid()">
                    Save Trip
                </app-primary-button>
            </div>
        </div>
    }
</div>
