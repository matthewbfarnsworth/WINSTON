<div class="max-w-md mx-auto space-y-4">
    @if (isLoading()) {
        <div class="flex items-center justify-between gap-4">
            <app-loading-state />
            <app-link-button routerLink="/transactions" variant="muted">Back</app-link-button>
        </div>
    } @else {
        <div class="flex items-center justify-between gap-4 border-b border-slate-200 pb-2">
            <h1 class="text-xl font-bold text-slate-900 tracking-tight">
                {{ isEditMode() ? 'Edit Transaction' : 'New Transaction' }}
            </h1>
            <app-link-button routerLink="/transactions" variant="muted">Back</app-link-button>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Date:</label>
                <app-date-input [(value)]="date" />
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Recipient:</label>
                <app-user-select [users]="availableRecipients()" [(value)]="recipientId" />
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Cost:</label>
                <app-currency-input [(value)]="cost" />
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Notes:</label>
                <app-notes-input [(value)]="notes" />
            </div>
            <div>
                <app-primary-button (buttonClick)="saveTransaction()" [disabled]="!isFormValid()">
                    Save Transaction
                </app-primary-button>
            </div>
        </div>
    }
</div>
