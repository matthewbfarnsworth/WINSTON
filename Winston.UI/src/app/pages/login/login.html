<div class="min-h-screen bg-[#f2f2f2] flex flex-col justify-between p-4 font-sans text-slate-700">
    <div></div>
    <div class="max-w-110 w-full mx-auto bg-white p-11 border border-slate-200 shadow-md rounded-none">
        <div class="mb-6">
            <span class="bg-cyan-600 text-white w-6 h-6 flex items-center justify-center text-sm font-bold">W</span>
            <span class="font-semibold text-slate-800 text-sm tracking-wide">Winston</span>
        </div>
        <h1 class="text-2xl font-semibold text-slate-900 tracking-tight">Pick an account</h1>
        <p class="text-slate-500 text-sm mt-1">to continue to Winston</p>
    </div>

    @if (isLoading()) {
        <div class="flex justify-center py-8">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-cyan-600"></div>
        </div>
    } @else {
        <div class="space-y-3">
            @for (user of users(); track user.id) {
                @if (user.id) {
                    <button (click)="onLogin(user.id)"
                        class="w-full text-left px-4 py-3 rounded border border-slate-200 hover:border-cyan-500 bg-slate-50 hover:bg-slate-100
                        transition-all duration-150 flex items-center justify-between group">
                        <span class="font-semibold text-slate-700 group-hover:text-cyan-600">{{ user.name }}</span>
                        <span class="text-slate-400 group-hover:text-cyan-600 text-xs">Login &rarr;</span>
                    </button>
                }
            } @empty {
                <div class="text-center py-8 text-slate-400 border border-dashed border-slate-200 rounded-lg">
                    No users found in database.
                </div>
            }
        </div>
    }
</div>
